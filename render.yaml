services:
  - type: web
    name: sap-research-agent-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api_bridge:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ACE_API_KEY
        sync: false
      - key: SAP_API_KEY
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false

  - type: web
    name: sap-research-agent-dashboard
    runtime: static
    buildCommand: "touch .noop"
    publishPath: dashboard

  - type: cron
    name: sap-hourly-research
    runtime: python
    schedule: "0 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
